{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | AI SkinCare Safety Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --cream: #FBFCFB;
            --beige-light: #F5F7F5;
            --sage: #6B8E7C;
            --white: #FFFFFF;
            --text-dark: #2A362F;
            --text-muted: #7A8D84;
            --bg: var(--cream);
            --surface: rgba(255, 255, 255, 0.92);
            --primary: var(--sage);
            --border: rgba(107, 142, 124, 0.2);
        }
        body.dark-mode {
            --bg: #1A1F1C;
            --surface: rgba(30, 36, 33, 0.94);
            --text-dark: #F1F5F0;
            --text-muted: #B2C5B9;
            --white: #242B27;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            transition: background 0.3s ease;
            background-image: radial-gradient(circle at 10% 30%, rgba(107, 142, 124, 0.06) 0%, transparent 50%);
        }
        .header-section { text-align: center; padding: 2rem 1rem 1rem; }
        .main-logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-dark);
            margin-bottom: 1.8rem;
        }
        .nav-container {
            display: inline-flex;
            background: var(--white);
            padding: 0.5rem 1.8rem;
            border-radius: 80px;
            border: 1px solid var(--border);
            gap: 2.2rem;
        }
        .nav-container a {
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            transition: 0.2s;
        }
        .nav-container a:hover, .nav-container a.active { color: var(--primary); font-weight: 600; }
        .container { display: flex; justify-content: center; padding: 2.5rem 1rem 4rem; animation: fadeUp 0.6s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: 0 20px 32px -12px rgba(0, 0, 0, 0.06);
        }
        .role-switch {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            background: var(--beige-light);
            width: fit-content;
            margin: 0 auto 2rem auto;
            padding: 0.35rem;
            border-radius: 48px;
        }
        .role-switch button {
            border: none;
            background: transparent;
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .role-switch button.active {
            background: var(--white);
            color: var(--primary);
            font-weight: 600;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .tabs span {
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            padding-bottom: 0.6rem;
        }
        .tabs span.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            font-weight: 600;
        }
        .auth-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.4rem;
        }
        .auth-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        input, select {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 1px solid transparent;
            border-radius: 1.25rem;
            font-family: 'Inter', sans-serif;
            background: var(--beige-light);
            color: var(--text-dark);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(107, 142, 124, 0.1);
        }
        .submit-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 0.75rem;
            transition: 0.2s;
        }
        .submit-btn:hover { background: #5a7d69; transform: translateY(-1px); }
        .fab-container { position: fixed; bottom: 28px; right: 28px; z-index: 2000; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        #fab-main { width: 52px; height: 52px; border-radius: 50%; background: var(--white); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .fab-menu { display: flex; flex-direction: column; gap: 12px; opacity: 0; visibility: hidden; transform: translateY(16px); transition: 0.25s; }
        .fab-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .fab-item { width: 44px; height: 44px; border-radius: 50%; background: var(--white); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--primary); }
        .fab-item:hover { background: var(--primary); color: white; }
        body.rtl { direction: rtl; }
        body.rtl .fab-container { left: 28px; right: auto; }
        @media (max-width: 480px) { .card { padding: 1.5rem; } .nav-container { gap: 1rem; padding: 0.4rem 1.2rem; } }
    </style>
</head>
<body>

<div class="header-section">
    <h1 class="main-logo-title" id="proj-title">AI SkinCare Safety Analyzer</h1>
    <div class="nav-container">
        <a href="/" id="link-home">Home</a>
        <a href="{% url 'catalog' %}" id="link-catalog">Catalog</a>
        <a href="{% url 'analyzer' %}" id="link-analyzer">Analyzer</a>
        <a href="{% url 'login' %}" class="active" id="link-account">Account</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="role-switch">
            <button id="btn-user" class="active" onclick="switchRole('user')">👤 User</button>
            <button id="btn-admin" onclick="switchRole('admin')">🛡️ Admin</button>
        </div>
        <div class="tabs" id="auth-tabs">
            <span id="tab-login" class="active" onclick="showLogin()">Sign in</span>
            <span id="tab-register" onclick="showRegister()">Create account</span>
        </div>
        <div id="login-section">
            <div class="auth-title" id="login-title">Welcome back</div>
            <div class="auth-subtitle" id="login-subtitle">Continue your skincare journey</div>
            <form method="POST" id="loginForm">
                {% csrf_token %}
                <input type="text" name="username" id="in-user" placeholder="Username" required>
                <input type="password" name="password" id="in-pass" placeholder="Password" required>
                <button type="submit" class="submit-btn" id="btn-signin">Sign In</button>
            </form>
        </div>
        <div id="register-section" style="display:none;">
            <div class="auth-title" id="reg-title">Create Account</div>
            <div class="auth-subtitle" id="reg-subtitle">Join our intelligent beauty lab</div>
            <form method="POST" id="registerForm">
                {% csrf_token %}
                <input type="text" name="full_name" id="in-name" placeholder="Full Name" required>
                <input type="text" name="username" id="in-user2" placeholder="Username" required>
                <select name="skin_type" id="skin-select" required>
                    <option value="" disabled selected>Select Skin Type</option>
                    <option value="oily">Oily</option>
                    <option value="dry">Dry</option>
                    <option value="normal">Normal</option>
                    <option value="combination">Combination</option>
                    <option value="sensitive">Sensitive</option>
                </select>
                <input type="password" name="password" id="in-pass2" placeholder="Password" required>
                <input type="password" name="confirm_password" id="in-pass-confirm" placeholder="Confirm Password" required>
                <button type="submit" class="submit-btn" id="btn-create">Create Account</button>
            </form>
        </div>
    </div>
</div>

<div class="fab-container">
    <div class="fab-menu" id="fab-menu">
        <button class="fab-item" onclick="toggleDarkMode()"><span id="fab-dm-icon">🌙</span></button>
        <button class="fab-item" onclick="changeFontSize()">A</button>
        <button class="fab-item" onclick="toggleLanguage()">🌐</button>
    </div>
    <button id="fab-main" onclick="toggleFab()"><i class="material-icons-outlined" style="color:var(--sage); font-size: 24px;">settings</i></button>
</div>

<script>
    function toggleFab() { document.getElementById('fab-menu').classList.toggle('active'); }
    function showLogin() {
        document.getElementById("login-section").style.display = "block";
        document.getElementById("register-section").style.display = "none";
        document.getElementById("tab-login").classList.add("active");
        document.getElementById("tab-register").classList.remove("active");
        updateUIText();
    }
    function showRegister() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("register-section").style.display = "block";
        document.getElementById("tab-login").classList.remove("active");
        document.getElementById("tab-register").classList.add("active");
        updateUIText();
    }
    function switchRole(role) {
        const isAdmin = role === 'admin';
        document.getElementById('btn-admin').classList.toggle('active', isAdmin);
        document.getElementById('btn-user').classList.toggle('active', !isAdmin);
        document.getElementById('auth-tabs').style.visibility = isAdmin ? "hidden" : "visible";
        showLogin();
    }
    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        document.getElementById("fab-dm-icon").innerText = isDark ? "☀️" : "🌙";
        localStorage.setItem("darkMode", isDark ? "on" : "off");
    }
    if(localStorage.getItem("darkMode") === "on") { document.body.classList.add("dark-mode"); document.getElementById("fab-dm-icon").innerText = "☀️"; }
    let currentSizeIdx = 1;
    function changeFontSize() { 
        let sizes = ['14px', '16px', '19px'];
        currentSizeIdx = (currentSizeIdx + 1) % 3;
        document.documentElement.style.fontSize = sizes[currentSizeIdx];
    }
    function toggleLanguage() {
        document.body.classList.toggle('rtl');
        const isRtl = document.body.classList.contains('rtl');
        document.body.dir = isRtl ? "rtl" : "ltr";
        localStorage.setItem("rtl", isRtl);
        updateUIText();
    }
    if(localStorage.getItem("rtl") === "true") { document.body.classList.add('rtl'); toggleLanguage(); }
    function updateUIText() {
        const isRtl = document.body.classList.contains('rtl');
        const isAdmin = document.getElementById('btn-admin').classList.contains('active');
        const isLoginVisible = document.getElementById('login-section').style.display !== "none";
        document.getElementById('proj-title').innerText = isRtl ? "مساعد العناية بالبشرة الذكي" : "AI SkinCare Safety Analyzer";
        document.getElementById('link-home').innerText = isRtl ? "الرئيسية" : "Home";
        document.getElementById('link-catalog').innerText = isRtl ? "الكتالوج" : "Catalog";
        document.getElementById('link-analyzer').innerText = isRtl ? "المحلل" : "Analyzer";
        document.getElementById('link-account').innerText = isRtl ? "حسابي" : "Account";
        document.getElementById('tab-login').innerText = isRtl ? "تسجيل الدخول" : "Sign in";
        document.getElementById('tab-register').innerText = isRtl ? "إنشاء حساب" : "Create account";
        document.getElementById('btn-signin').innerText = isRtl ? "دخول" : "Sign In";
        document.getElementById('btn-create').innerText = isRtl ? "إنشاء حساب" : "Create Account";
        if(isAdmin) {
            document.getElementById('login-title').innerText = isRtl ? "مرحباً أيها المشرف" : "Admin Access";
            document.getElementById('login-subtitle').innerText = isRtl ? "بوابة دخول المشرفين" : "Administrator Portal";
        } else if(isLoginVisible) {
            document.getElementById('login-title').innerText = isRtl ? "مرحباً بعودتك" : "Welcome back";
            document.getElementById('login-subtitle').innerText = isRtl ? "تابعي رحلة العناية ببشرتك" : "Continue your skincare journey";
        } else {
            document.getElementById('reg-title').innerText = isRtl ? "إنشاء حساب" : "Create Account";
            document.getElementById('reg-subtitle').innerText = isRtl ? "انضمي إلى مختبر الجمال الذكي" : "Join our intelligent beauty lab";
        }
        const placeholders = {
            'in-user': isRtl ? "اسم المستخدم" : "Username",
            'in-pass': isRtl ? "كلمة المرور" : "Password",
            'in-name': isRtl ? "الاسم الكامل" : "Full Name",
            'in-user2': isRtl ? "اسم المستخدم" : "Username",
            'in-pass2': isRtl ? "كلمة المرور" : "Password",
            'in-pass-confirm': isRtl ? "تأكيد كلمة المرور" : "Confirm Password"
        };
        for(let [id, text] of Object.entries(placeholders)) {
            let el = document.getElementById(id);
            if(el) el.placeholder = text;
        }
        let skinSelect = document.getElementById('skin-select');
        if(skinSelect) {
            let options = skinSelect.options;
            if(isRtl) {
                if(options[0]) options[0].text = "اختر نوع البشرة";
                if(options[1]) options[1].text = "دهنية";
                if(options[2]) options[2].text = "جافة";
                if(options[3]) options[3].text = "عادية";
                if(options[4]) options[4].text = "مختلطة";
                if(options[5]) options[5].text = "حساسة";
            } else {
                if(options[0]) options[0].text = "Select Skin Type";
                if(options[1]) options[1].text = "Oily";
                if(options[2]) options[2].text = "Dry";
                if(options[3]) options[3].text = "Normal";
                if(options[4]) options[4].text = "Combination";
                if(options[5]) options[5].text = "Sensitive";
            }
        }
    }
    updateUIText();
</script>
</body>
</html>
